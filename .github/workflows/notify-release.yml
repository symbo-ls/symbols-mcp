# Drop into <repo>/.github/workflows/notify-release.yml
#
# Dispatches a `source-changed` event to release-manager AFTER the local
# Test workflow has concluded successfully on a push to main. The
# `workflow_run` trigger is the gate: if Test fails, this never runs,
# the manager is never invoked, and the broken commit cannot publish.
#
# Required secret on this repo: RELEASE_MANAGER_DISPATCH_TOKEN — a GitHub
# Classic PAT with `repo` scope on symbo-ls/release-manager (SSO authorized).

name: Notify release-manager

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Skip when:
    #  - the Test workflow itself failed (don't publish broken code)
    #  - the head commit is a chore(release) bump (avoid republish loop)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message != null &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
    steps:
      - name: Dispatch source-changed to release-manager
        # A publish-notify must not red-fail CI over a rotated external
        # credential. Dispatch when the token works; warn (and exit 0) when it
        # does not, so a missed auto-publish stays visible without blocking
        # main. Rotate RELEASE_MANAGER_DISPATCH_TOKEN (Classic PAT, repo scope,
        # SSO-authorized for symbo-ls) to restore auto-publish.
        env:
          TOKEN: ${{ secrets.RELEASE_MANAGER_DISPATCH_TOKEN }}
          PAYLOAD: >-
            {"event_type":"source-changed","client_payload":{"repo":"${{ github.repository }}","ref":"${{ github.event.workflow_run.head_branch }}","sha":"${{ github.event.workflow_run.head_sha }}","actor":"${{ github.event.workflow_run.actor.login }}","message":${{ toJSON(github.event.workflow_run.head_commit.message) }}}}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::RELEASE_MANAGER_DISPATCH_TOKEN not set — release-manager NOT notified; auto-publish will not fire."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch_resp.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/symbo-ls/release-manager/dispatches \
            -d "${PAYLOAD}")
          if [ "$code" = "204" ]; then
            echo "Dispatched source-changed to release-manager (sha ${{ github.event.workflow_run.head_sha }})."
          else
            echo "::warning::release-manager dispatch failed (HTTP ${code}: $(cat /tmp/dispatch_resp.json 2>/dev/null)). Auto-publish did NOT fire — rotate RELEASE_MANAGER_DISPATCH_TOKEN or trigger the release-manager manually. Not failing the build over an external credential."
          fi
