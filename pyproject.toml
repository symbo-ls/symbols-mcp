[project]
name = "symbols-mcp"
version = "3.14.772"
description = "Symbols.app MCP — docs, code generation, publishing, CLI/SDK reference"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
dependencies = [
    # UPPER BOUND IS LOAD-BEARING, not caution. symbols_mcp/server.py imports
    # `from mcp.server.fastmcp import FastMCP, Context`, and the 2.x SDK
    # REMOVED that module entirely — the 2.1.0 wheel ships no `fastmcp` path at
    # all, replacing it with `mcp/server/mcpserver/`. Without this bound a fresh
    # resolve installs mcp 2.x and the server dies at import with
    # `ModuleNotFoundError: No module named 'mcp.server.fastmcp'`, which a
    # client reports only as CONNECTION_CLOSED.
    #
    # That is not hypothetical: every `uvx symbols-mcp` since mcp 2.0 shipped
    # has been resolving 2.x against this unbounded spec. Lifting the bound is
    # a PORT (FastMCP -> MCPServer across 28 tools), not a version bump.
    "mcp[cli]>=1.9.0,<2",
    "httpx>=0.27.0",

    # TRANSITIVE PIN, not a direct import. mcp[cli] -> pyjwt[crypto] ->
    # cryptography; cryptography 49.0.0 dropped the macOS x86_64/universal2
    # wheel (arm64-only from 49.0.0 on), so a cold `uvx symbols-mcp` on an
    # Intel Mac falls back to a source build, which needs a Rust toolchain
    # newer than ships on older macOS setups (rustc >=1.83, vs 1.81 here) and
    # fails. 48.0.1 is the last cryptography with an x86_64 wheel and pyjwt's
    # own floor (cryptography>=3.4.0) has no upper bound, so this constraint
    # only narrows the darwin/x86_64 resolve — every other platform keeps
    # resolving latest cryptography unchanged.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
symbols-mcp = "symbols_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["symbols_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]
