[project]
name = "symbols-mcp"
version = "3.14.788"
description = "Symbols.app MCP — docs, code generation, publishing, CLI/SDK reference"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
dependencies = [
    # UPPER BOUND IS LOAD-BEARING, not caution. symbols_mcp/server.py imports
    # `from mcp.server.fastmcp import FastMCP, Context`, and the 2.x SDK
    # REMOVED that module entirely — the 2.1.0 wheel ships no `fastmcp` path at
    # all, replacing it with `mcp/server/mcpserver/`. Without this bound a fresh
    # resolve installs mcp 2.x and the server dies at import with
    # `ModuleNotFoundError: No module named 'mcp.server.fastmcp'`, which a
    # client reports only as CONNECTION_CLOSED.
    #
    # That is not hypothetical: every `uvx symbols-mcp` since mcp 2.0 shipped
    # has been resolving 2.x against this unbounded spec. Lifting the bound is
    # a PORT (FastMCP -> MCPServer across 28 tools), not a version bump.
    #
    # FLOOR 1.10.0: the text tools register with
    # `@mcp.tool(structured_output=False)`; FastMCP.tool takes that argument
    # from 1.10.0 on, and on 1.9.x the server would die at import with a
    # TypeError.
    "mcp[cli]>=1.10.0,<2",
    "httpx>=0.27.0",

    # TRANSITIVE PIN, not a direct import. mcp[cli] -> pyjwt[crypto] ->
    # cryptography; cryptography 49.0.0 dropped the macOS x86_64/universal2
    # wheel (arm64-only from 49.0.0 on), so a cold `uvx symbols-mcp` on an
    # Intel Mac falls back to a source build, which needs a Rust toolchain
    # newer than ships on older macOS setups (rustc >=1.83, vs 1.81 here) and
    # fails. 48.0.1 is the last cryptography with an x86_64 wheel, so Intel
    # Macs stay below 49.
    #
    # The second line is the exact complement of the first and asks for >=49
    # on every other platform (pyjwt's own floor, cryptography>=3.4.0, has no
    # upper bound). The pair makes uv fork uv.lock on darwin/x86_64. With the
    # Intel cap alone, the lock had no such fork: the cap held the whole
    # non-Windows fork, so `uv sync --frozen` gave Linux and Apple Silicon
    # 48.0.1 as well, below the 49.0.0/50.0.0 security fixes. Now Intel Macs
    # resolve 48.0.1 and every other platform resolves the latest
    # cryptography, both from PyPI (`uvx symbols-mcp`) and from uv.lock.
    # Nika d1200qc, 2026-11-27.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=49; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
symbols-mcp = "symbols_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["symbols_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]
